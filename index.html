      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        background-color: #030712;
        /* Atmospheric fade background */
        background-image: 
          radial-gradient(circle at 50% -20%, #1e1b4b 0%, transparent 50%),
          radial-gradient(circle at 0% 100%, #064e3b 0%, transparent 30%),
          radial-gradient(circle at 100% 100%, #1e1b4b 0%, transparent 30%);
        background-attachment: fixed;
        color: #f9fafb;
        overflow-x: hidden;
      }
      #root {
        min-height: 100vh;
      }
      .cyber-gradient-text {
        background: linear-gradient(135deg, #6366f1 0%, #2dd4bf 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .glass-card {
        background: rgba(10, 11, 30, 0.4);
        backdrop-filter: blur(24px);
        border: 1px solid rgba(99, 102, 241, 0.1);
      }
      .circuit-border {
        position: relative;
      }
      .circuit-border::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 1px;
        background: linear-gradient(90deg, transparent, #6366f1, #2dd4bf, transparent);
      }
      .mountain-waves {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;

      /* Soft film grain to soften gradients */
      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
